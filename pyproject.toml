[project]
name = "orebody"
version = "0.0.1"
description = "AI-generated, source-linked equity research notes for under-covered copper juniors"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pymupdf",
    "pyyaml",
    "typer",
    "anthropic",
]

[project.scripts]
orebody = "orebody.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orebody"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-W", "ignore:builtin type:DeprecationWarning"]
markers = [
    "live: calls the live Anthropic API; skipped without ANTHROPIC_API_KEY",
    "edgar_live: calls the live SEC EDGAR API; skipped unless OREBODY_LIVE_EDGAR=1",
]
